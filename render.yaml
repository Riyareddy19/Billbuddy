services:
  - type: web
    name: billbuddy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BILLBUDDY_FRONTEND_ORIGINS
        sync: false
      - key: BILLBUDDY_COOKIE_SECURE
        value: "true"
      - key: BILLBUDDY_COOKIE_SAMESITE
        value: lax
      - key: BILLBUDDY_API_KEY
        sync: false
      - key: BILLBUDDY_DASHBOARD_PASSWORD
        sync: false
      - key: BILLBUDDY_SESSION_SECRET
        sync: false

  - type: web
    name: billbuddy-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
