services:
  - type: web
    name: billbuddy-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BILLBUDDY_FRONTEND_ORIGINS
        sync: false
      - key: BILLBUDDY_COOKIE_SECURE
        value: "true"
      - key: BILLBUDDY_COOKIE_SAMESITE
        value: lax
      - key: BILLBUDDY_API_KEY
        sync: false
      - key: BILLBUDDY_DASHBOARD_PASSWORD
        sync: false
      - key: BILLBUDDY_SESSION_SECRET
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_AGENT_ID
        sync: false
